name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - feat/topics-tasks-timetable
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Export Web Application
        run: npx expo export --platform web

      - name: Configure SPA Routing and GitHub Pages
        run: |
          # Ensure GitHub Pages does not run Jekyll, which would ignore _expo/ static files
          touch dist/.nojekyll
          # Inject PWA manifest link into static HTML files
          sed -i 's|</head>|<link rel="manifest" href="/Task-managment-app-or-website/manifest.json"><link rel="icon" type="image/png" href="/Task-managment-app-or-website/favicon.png"><meta name="theme-color" content="#1F2937"></head>|' dist/index.html
          # Copy index.html to 404.html for SPA client-side routing on GitHub Pages
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

